name: Update Saints Lunch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - run: python update_calendar.py

      - name: Prepare website
        run: |
          mkdir site
          cp lunch.ics site/lunch.ics
          echo '<!doctype html><html><body><h1>St. George'\''s Senior Lunch Calendar</h1><p><a href="lunch.ics">Subscribe/download calendar</a></p></body></html>' > site/index.html

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
