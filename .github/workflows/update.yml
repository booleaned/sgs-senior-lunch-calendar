name: Update Saints Lunch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - run: python update_calendar.py

      - name: Save calendar
        run: |
          git config user.name "Saints Lunch Bot"
          git config user.email "actions@github.com"
          git add lunch.ics
          git diff --cached --quiet || git commit -m "Update lunch menu"
          git push
